name: road-warrior

# -----------------------------------------------------------------------------
#  Local development stack: Postgres + FastAPI + Next.js
#  In production the backend talks to Neon (serverless Postgres) via DATABASE_URL.
# -----------------------------------------------------------------------------

services:
  # ---------- Database (local Postgres 16) -----------------------------------
  db:
    image: postgres:16-alpine
    container_name: roadwarrior-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roadwarrior}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadwarrior}
      POSTGRES_DB: ${POSTGRES_DB:-roadwarrior}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roadwarrior} -d ${POSTGRES_DB:-roadwarrior}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Backend (FastAPI) ---------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadwarrior-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # If backend/.env is missing, fall back to the local DB inside this network
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://roadwarrior:roadwarrior@db:5432/roadwarrior}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ---------- Frontend (Next.js) --------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: roadwarrior-frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
  frontend_node_modules:
